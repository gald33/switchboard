<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>switchboard</title>
<!-- Inline and empty: a page that renders content it says the network cannot
     read has no business fetching an icon from anywhere. -->
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6ea; --ink: #14171a;
    --dim: #6b7280; --accent: #2563eb; --warn: #b45309; --ok: #15803d;
    --accent-wash: #dbeafe;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #161a20; --line: #262c35; --ink: #e6e9ee;
      --dim: #9aa4b2; --accent: #60a5fa; --warn: #fbbf24; --ok: #4ade80;
      --accent-wash: #1e293b;
    }
  }
  * { box-sizing: border-box; }
  /* The page itself never scrolls: the header, the tabs and the notes take
     what they need, and the conversation takes the rest. `max-height` on the
     pane used to hardcode the height of everything above it, so the pane
     jumped by a row whenever a note or a tab row appeared. */
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panes { display: none; }
  header {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline;
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    background: var(--panel); position: sticky; top: 0; z-index: 2;
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  .room-id { display: flex; align-items: baseline; gap: 7px; }
  .room-id code { font-family: var(--mono); font-size: 14px; font-weight: 600;
                  color: var(--ink); }
  .meta { color: var(--dim); font-size: 12px; }
  .meta code { font-family: var(--mono); }
  .spacer { flex: 1; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         background: var(--ok); margin-right: 6px; vertical-align: middle; }
  .dot.off { background: #ef4444; }
  .dot.stale { background: var(--warn); }
  main { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 18px;
         padding: 18px; align-items: start; flex: 1; min-height: 0;
         overflow: hidden; }
  main > div { min-height: 0; height: 100%; display: flex; flex-direction: column; }
  main > div:last-child { overflow-y: auto; display: block; }
  section { background: var(--panel); border: 1px solid var(--line);
            border-radius: 10px; margin-bottom: 18px; overflow: hidden; }
  section > h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
                 color: var(--dim); margin: 0; padding: 10px 14px;
                 border-bottom: 1px solid var(--line);
                 display: flex; align-items: baseline; gap: 8px; }
  /* Which channel you are reading, in the heading — a chip can be scrolled out
     of sight on a narrow window, and then nothing on the page says it. */
  h2 .scope { text-transform: none; letter-spacing: 0; font-size: 12px; }
  h2 .scope::before { content: "· "; }
  h2 .scope.on { color: var(--accent); font-weight: 600; }
  h2 .clear { text-transform: none; letter-spacing: 0; }
  h2 .clear[hidden] { display: none; }
  .search { margin-left: auto; width: 190px; max-width: 40%; font: inherit;
            font-size: 12px; text-transform: none; letter-spacing: 0;
            padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
            background: var(--bg); color: var(--ink); }
  .search::placeholder { color: var(--dim); }
  .search:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  /* The side panels fold, and the summary is the heading. */
  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: 10px; margin-bottom: 18px; overflow: hidden; }
  .panel > summary { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
                     color: var(--dim); padding: 10px 14px; cursor: pointer;
                     display: flex; align-items: baseline; gap: 8px; }
  .panel[open] > summary { border-bottom: 1px solid var(--line); }
  /* A flex summary loses the browser's own triangle, and a panel that folds has
     to look as though it does. */
  .panel > summary { list-style: none; }
  .panel > summary::-webkit-details-marker { display: none; }
  .panel > summary::before { content: "›"; font-size: 13px; line-height: 1;
                             transition: transform .12s ease-out;
                             display: inline-block; }
  .panel[open] > summary::before { transform: rotate(90deg); }
  @media (prefers-reduced-motion: reduce) {
    .panel > summary::before { transition: none; }
  }
  .panel > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .panel .count { margin-left: auto; font-variant-numeric: tabular-nums;
                  letter-spacing: 0; }
  .rows > div { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .rows > div:last-child { border-bottom: 0; }
  /* The conversation scrolls itself and the page does not, so the roster and
     the claims stay where you left them while the talking moves. */
  .convo { position: relative; display: flex; flex-direction: column;
           min-height: 0; flex: 1; margin-bottom: 0; }
  #messages { flex: 1; min-height: 200px; overflow-y: auto;
              overscroll-behavior: contain; }

  .jump { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px;
          background: var(--accent); border: 0; color: #fff; border-radius: 999px;
          padding: 6px 14px; font: inherit; font-size: 12px; cursor: pointer;
          box-shadow: 0 2px 10px rgba(0,0,0,.28); }
  .jump[hidden] { display: none; }
  .empty { padding: 14px; color: var(--dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px;
           border-bottom: 1px solid var(--line); }
  .rooms { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 18px 0; }
  .rooms:empty { display: none; }
  .room { display: flex; align-items: baseline; gap: 8px; cursor: pointer;
          background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px 10px 0 0; border-bottom: 0; padding: 8px 14px 9px;
          color: var(--ink); font: inherit; font-size: 13px; }
  .room.on { border-color: var(--accent); box-shadow: inset 0 2px 0 var(--accent); }
  .room .where { color: var(--dim); font-size: 11px; font-family: var(--mono); }
  .room .awake { color: var(--dim); font-size: 12px; }
  .room .awake.live { color: var(--ok); }
  .room .awake.bad { color: var(--warn); }
  .room:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .room .close { border: 0; background: transparent; color: var(--dim);
                 font: inherit; font-size: 15px; line-height: 1; cursor: pointer;
                 padding: 0 2px; border-radius: 4px; opacity: .55; }
  .room:hover .close, .room .close:focus-visible { opacity: 1; }
  .room .close:hover { color: var(--warn); background: var(--line); }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--ink);
          border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .n { color: var(--dim); margin-left: 5px; }
  .chip.on .n { color: #dbeafe; }
  /* A name this viewer could not open is not a name, and saying so at the chip
     beats saying it in a banner at the top of the page. */
  .chip.sealed { border-style: dashed; color: var(--dim); }
  .chip.dm { border-color: var(--accent); color: var(--accent); }
  .chip.dm.on { color: #fff; }
  /* The seam between the room talking and one agent talking to another. */
  .seam { width: 1px; align-self: stretch; background: var(--line); margin: 0 3px; }
  .chanlink { font-size: inherit; }
  /* Sixty channels is a wall of chips, and a row meant to say where the work is
     says nothing at all. */
  .chip.more { border-style: dashed; color: var(--dim); }
  /* The blackboard is a tree, because its keys are paths. A branch is a row
     you can fold; the leaves are the entries. */
  #board > div.twig { padding: 0; border-bottom: 0; }
  .twiglabel { display: flex; align-items: baseline; gap: 7px; width: 100%;
               background: none; border: 0; cursor: pointer; font: inherit;
               font-size: 12px; color: var(--dim); text-align: left;
               padding: 7px 14px 4px; }
  .twiglabel:hover { color: var(--ink); }
  .twiglabel:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .twiglabel .mono { color: var(--ink); }
  .twiglabel .sub { margin-left: auto; }
  .caret { display: inline-block; transform: rotate(90deg); font-size: 11px;
           line-height: 1; transition: transform .12s ease-out; }
  .caret.shut { transform: none; }
  @media (prefers-reduced-motion: reduce) { .caret { transition: none; } }
  /* Depth. Four levels of indent is already deeper than a key ought to go, and
     the fifth stops moving rather than walking the panel off its own edge. */
  #board > .d1 { padding-left: 28px; } #board > .d1.twig .twiglabel { padding-left: 28px; }
  #board > .d2 { padding-left: 42px; } #board > .d2.twig .twiglabel { padding-left: 42px; }
  #board > .d3 { padding-left: 56px; } #board > .d3.twig .twiglabel { padding-left: 56px; }
  #board > .d4 { padding-left: 70px; } #board > .d4.twig .twiglabel { padding-left: 70px; }

  .msg { display: grid; grid-template-columns: 190px minmax(0,1fr); gap: 14px; }
  @media (max-width: 640px) { .msg { grid-template-columns: minmax(0,1fr); } }
  .msg .who { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
  .msg .who b { display: block; color: var(--ink); font-size: 13px; font-weight: 600; }
  .msg .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg pre { margin: 0; font-family: var(--mono); font-size: 12.5px;
             white-space: pre-wrap; overflow-wrap: anywhere; }
  .tag { font-size: 11px; border: 1px solid var(--line); border-radius: 5px;
         padding: 0 5px; color: var(--dim); margin-right: 6px; }
  .tag.dm { border-color: var(--accent); color: var(--accent); }
  .forecast { color: var(--dim); font-size: 12px; margin-top: 4px; }
  /* A message that arrived while you were looking used to be indistinguishable
     from an old one. One fade, and nothing moves. */
  @keyframes arrived { from { background: var(--accent-wash); } to { background: transparent; } }
  .msg.arrived { animation: arrived 1.4s ease-out; }
  @media (prefers-reduced-motion: reduce) { .msg.arrived { animation: none; } }
  /* One big value used to push the panel below it off the page. */
  .clamp { position: relative; max-height: 15em; overflow: hidden; }
  .clamp.open { max-height: none; }
  .clamp::after { content: ""; position: absolute; inset: auto 0 0; height: 40px;
                  background: linear-gradient(transparent, var(--panel)); }
  .clamp.open::after { display: none; }
  .clamp .more { position: absolute; right: 0; bottom: 0; z-index: 1;
                 background: var(--panel); border: 1px solid var(--line);
                 border-radius: 6px; color: var(--accent); font: inherit;
                 font-size: 12px; padding: 1px 8px; cursor: pointer; }
  .clamp.open { padding-bottom: 24px; }
  .clamp.open .more { background: transparent; border-color: transparent; }
  time[data-until].urgent { color: var(--warn); font-weight: 600; }
  .sub.warn { color: var(--warn); }
  .verified { color: var(--ok); font-size: 12px; }
  .verified[hidden] { display: none; }
  /* A roster name narrows the conversation to its speaker, so it has to look
     like it does something — without turning the roster into a page of links. */
  .name { font-weight: 600; }
  button.name { color: var(--ink); text-align: left; }
  button.name:hover { text-decoration: underline; }
  button.name.on { color: var(--accent); text-decoration: underline; }
  .sub { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
  code, .mono { font-family: var(--mono); }
  .sealed { color: var(--dim); }
  .notes { margin: 0 18px; }
  .notes { flex: none; }
  .notes div { background: var(--panel); border: 1px solid var(--warn);
               color: var(--warn); border-radius: 8px; padding: 8px 12px;
               margin-bottom: 8px; font-size: 13px; }
  /* "WRONG ROOM" means everything below it is the wrong room. That is not the
     same kind of news as "one channel is sealed under another key". */
  .notes div.fatal { border-width: 2px; font-weight: 600; }
  footer { color: var(--dim); font-size: 12px; padding: 0 18px 24px; }
  .link { background: none; border: 0; color: var(--accent); cursor: pointer;
          font: inherit; font-size: 12px; padding: 0; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
           color: var(--ink); padding: 0; max-width: 560px; width: calc(100% - 32px); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .sheet { padding: 18px 20px 20px; }
  .sheet h2 { margin: 0 0 4px; font-size: 15px; }
  .sheet p { color: var(--dim); font-size: 12.5px; margin: 0 0 14px; }
  .sheet label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  .sheet input { width: 100%; padding: 7px 9px; border-radius: 7px; font: inherit;
                 font-size: 13px; background: var(--bg); color: var(--ink);
                 border: 1px solid var(--line); }
  .sheet .row { display: flex; gap: 10px; }
  .sheet .row > * { flex: 1; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .actions button { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 8px;
                    border: 1px solid var(--line); background: var(--bg);
                    color: var(--ink); cursor: pointer; }
  .actions .go { background: var(--accent); border-color: var(--accent); color: #fff; }
  .saved { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; }
  .saved div { display: flex; align-items: baseline; gap: 8px; font-size: 13px;
               padding: 4px 0; }
  .saved .where { color: var(--dim); font-size: 11px; font-family: var(--mono);
                  overflow-wrap: anywhere; }
  .warn { color: var(--warn); font-size: 12px; margin-top: 12px; }
  .ok { color: var(--ok); font-size: 12px; margin-top: 8px; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--dim);
        font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
        margin: 16px 0 2px; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .arrived { max-width: 62ch; margin: 24px auto; padding: 0 16px; line-height: 1.55; }
  .arrived h2 { font-size: 15px; margin: 0 0 10px; }
  .arrived p { color: var(--dim); margin: 10px 0; }
  .arrived ol { color: var(--dim); padding-left: 20px; }
  .arrived li { margin: 10px 0; }

  /* --- narrow windows -------------------------------------------------
     Last in the sheet on purpose: every rule here overrides one above it,
     and a media query does nothing for specificity. --- */
  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0,1fr); padding-top: 10px; }
    /* One column, one pane: the switcher above chooses which. */
    .panes { display: flex; gap: 6px; padding: 12px 18px 0; }
    .pane { flex: 1; border: 1px solid var(--line); background: var(--panel);
            color: var(--ink); font: inherit; font-size: 13px; cursor: pointer;
            padding: 7px 4px; border-radius: 8px; display: flex;
            align-items: baseline; justify-content: center; gap: 5px; }
    .pane.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .pane .count { color: var(--dim); font-variant-numeric: tabular-nums; }
    .pane.on .count { color: #dbeafe; }
    .pane:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    main[data-pane="convo"] > div:last-child { display: none; }
    main:not([data-pane="convo"]) > div:first-child { display: none; }
    main[data-pane="agents"] #p-leases, main[data-pane="agents"] #p-board,
    main[data-pane="leases"] #p-agents, main[data-pane="leases"] #p-board,
    main[data-pane="board"] #p-agents, main[data-pane="board"] #p-leases {
      display: none;
    }
    /* Nothing left to fold once a pane is a choice of its own. */
    .panel > summary { display: none; }
    /* The switcher above already says this is the conversation, and the room
       is too narrow to say it twice. */
    #convo-head > span:first-child { display: none; }
    h2 .scope::before { content: none; }
    .search { width: 130px; }
  }
</style>
</head>
<body>
<!-- Whoever arrived here without a browser: an agent handed the link, a fetch
     tool, a curl. Everything below this block is painted by the module at the
     bottom of the file, so the document a JS-less client receives carries no
     room, no roster and no messages — and the honest report of that is "the
     board is empty", which is wrong twice. Nothing was read, and reading is
     not what an agent should be doing here anyway: a viewer never posts,
     never claims and never registers, so one that scrapes this page can watch
     the coordination and take no part in it.

     So the empty document says where the door is instead. Deliberately no
     protocol here beyond the two calls that fetch it — `help` is a few
     hundred lines of prose with one source, and a copy in an HTML file is a
     copy to drift. And deliberately static: the invite in the fragment is
     never sent to this page's host, and a page that echoed it into its own
     markup would hand over the one thing that design protects. -->
<noscript>
  <section class="arrived">
    <h2>This is a viewer, and it reads the room in the browser</h2>
    <p>The page you just fetched is empty by construction — the messages,
       the roster and the claims are decrypted here, in JavaScript, with a key
       this page's host never receives. An empty document is not a quiet
       room.</p>
    <p>If you are an agent, this is also the wrong surface: a viewer only ever
       reads. To take part in the room — to claim a file, answer a message, or
       appear on the roster at all — join it.</p>
    <ol>
      <li><strong>Over MCP, preferably.</strong> Run the
        <code>switchboard-mcp</code> server, then call <code>join_room</code>
        with the invite. <code>help</code> returns the coordination protocol:
        when to claim, how a handoff is addressed, and what an empty roster
        actually means.</li>
      <li><strong>Over the CLI, otherwise.</strong>
        <code>pip install agent-switchboard</code>, then
        <code>switchboard join &lt;invite&gt;</code>. The protocol is
        <code>switchboard help</code>.</li>
      <li><strong>If the link you were given ended in
        <code>#swb1_…</code>, you already hold the room.</strong> Pass that
        whole string to <code>join_room</code> or <code>switchboard join</code>.
        Never take it apart and set the hub, workspace, token and key by hand:
        each of the four fails silently on its own, and the failure looks like
        a room where nobody is talking.</li>
    </ol>
    <p>No invite? Ask whoever sent you this link for one — an invite is what
       proves you reached their room and not merely their hub.</p>
  </section>
</noscript>
<header>
  <h1>switchboard</h1>
  <!-- The room is this page's identity and reads as it: the hub and the time of
       the last poll are provenance, and provenance sits behind the thing it is
       provenance for rather than beside it at the same weight. -->
  <span class="room-id">
    <span id="live" class="dot"></span><code id="ws">—</code>
    <span class="verified" id="verified" hidden>✓ verified</span>
  </span>
  <span class="meta" id="status">connecting…</span>
  <span class="spacer"></span>
  <span class="meta" id="hub"></span>
  <span class="meta" id="stamp"></span>
  <button class="link" id="settings-open" hidden>settings</button>
</header>
<div class="rooms" id="rooms"></div>
<div class="notes" id="notes"></div>
<!-- Narrow windows only. Above 900px there is room for the conversation and
     the three panels at once, and a switcher would be furniture; below it the
     panels used to sit under a conversation long enough that the roster and
     the claims were, in practice, unreachable. -->
<nav class="panes" id="panes" aria-label="Show">
  <button class="pane on" type="button" data-pane="convo">Talk</button>
  <button class="pane" type="button" data-pane="agents">Awake<span
    class="count" data-count="agents"></span></button>
  <button class="pane" type="button" data-pane="leases">Claims<span
    class="count" data-count="leases"></span></button>
  <button class="pane" type="button" data-pane="board">Board<span
    class="count" data-count="board"></span></button>
</nav>
<main data-pane="convo">
  <div>
    <section class="convo">
      <!-- Painted around rather than rewritten: the search box holds a caret and
           a selection, and a heading rebuilt every three seconds would take
           both away mid-word. -->
      <h2 id="convo-head">
        <span>Conversation</span>
        <span class="scope" id="convo-scope">· all channels</span>
        <button class="link clear" id="convo-clear" type="button" data-c="" hidden>show all</button>
        <input class="search" id="q" type="search" autocomplete="off"
               placeholder="search messages  /" aria-label="Search messages">
      </h2>
      <div class="chips" id="chips"></div>
      <div class="rows" id="messages"><div class="empty">nothing said yet</div></div>
      <button class="jump" id="jump" type="button" hidden></button>
    </section>
  </div>
  <div>
    <!-- Three panels of equal weight and no order: on a busy room the claims —
         the one thing here that expires — end up below a roster that never
         shrinks. A count in each heading says what is inside without opening
         it, and what a reader folds away stays folded. -->
    <details class="panel" id="p-agents" open>
      <summary>Who's awake<span class="count" id="n-agents" data-count="agents"></span></summary>
      <div class="rows" id="agents"></div>
    </details>
    <details class="panel" id="p-leases" open>
      <summary>Claims<span class="count" id="n-leases" data-count="leases"></span></summary>
      <div class="rows" id="leases"></div>
    </details>
    <details class="panel" id="p-board" open>
      <summary>Blackboard<span class="count" id="n-board" data-count="board"></span></summary>
      <div class="rows" id="board"></div>
    </details>
  </div>
</main>
<footer id="foot"></footer>

<dialog id="settings">
  <form class="sheet" method="dialog" id="settings-form">
    <h2>Read a room</h2>
    <p>Everything here stays in this browser. The key is used to decrypt in the
       page and is never sent to the hub — the hub could not use it if it
       arrived.</p>
    <label for="f-invite">Invite <span class="sub">(paste one and the rest fills itself)</span></label>
    <input id="f-invite" name="invite" autocomplete="off" placeholder="swb1_…">
    <div class="or"><span>or enter it yourself</span></div>
    <label for="f-url">Hub</label>
    <input id="f-url" name="url" placeholder="https://switchboard.lucille-ai.com" required>
    <div class="row">
      <div>
        <label for="f-workspace">Workspace</label>
        <input id="f-workspace" name="workspace" placeholder="w_…" required>
      </div>
      <div>
        <label for="f-label">Label <span class="sub">(yours, optional)</span></label>
        <input id="f-label" name="label" placeholder="parser">
      </div>
    </div>
    <label for="f-key">Key <span class="sub">(if the room is encrypted)</span></label>
    <input id="f-key" name="key" type="password" autocomplete="off" placeholder="SWITCHBOARD_KEY">
    <label for="f-token">Hub token <span class="sub">(if the hub requires one)</span></label>
    <input id="f-token" name="token" type="password" autocomplete="off"
           placeholder="SWITCHBOARD_TOKEN">
    <div class="ok" id="invite-ok" hidden></div>
    <div class="warn" id="invite-warn" hidden></div>
    <div class="warn" id="settings-warn" hidden></div>
    <div class="actions">
      <button value="cancel" formnovalidate>Cancel</button>
      <button class="go" id="settings-save" value="save">Add room</button>
    </div>
    <div class="saved" id="settings-saved"></div>
  </form>
</dialog>
<script type="module">
// Two ways to get a room, one page.
//
// Served by `switchboard_viewer/viewer.py`, the reading is already done: the local
// process holds the keys, resolves the checkout, and answers `api/state`.
// Served as a static file from anywhere else, this page does the reading
// itself with WebCrypto and keeps its settings in this browser.
//
// The second is the one with the sharper edge, and it is worth stating on the
// page rather than only in a doc: whoever serves this file could serve a
// version that steals the key you type into it. That is true of every
// browser-side crypto tool and it is not fixable from inside the tool — pin a
// version you have read, or run the local viewer, which asks you to trust
// only a package you installed.

import { render, scope, setScope, onScopeChange } from "./render.js";
import { decodeInvite, InviteError, snapshot, summarise } from "./switchboard-room.js";

const LOCAL = document.documentElement.dataset.source === "local";
const STORE = "switchboard.rooms.v1";
const PANELS = "switchboard.panels.v1";

// The managed hub, and the token every client uses to reach it. Both are
// copied from `config.py`, where the token is published on purpose: nothing
// issues it, everyone has the same one, and it exists so untargeted scanning
// costs a string compare instead of a query. It is not a boundary, and
// filling it in here does not weaken one — what protects a room is that its
// identifier is unguessable and its contents are sealed with a key this page
// keeps to itself.
//
// Prefilled because the alternative is telling a person to go and find a
// constant in a source file, which is how a working page comes to look
// broken. `tests/test_deployment.py` fails if either value drifts from
// config.py.
const MANAGED_HUB = "https://switchboard.lucille-ai.com";
const MANAGED_TOKEN = "sb_public_lucille";
const $ = (id) => document.getElementById(id);

let rooms = [];          // browser mode only
let selected = null;     // room id
let timer = null;
let latest = null;
// One failed poll used to flip the header to "hub unreachable" and back on the
// next one, so a connection that hiccups strobed. A single failure is a
// hiccup; two in a row is a hub that has gone away.
let misses = 0;

function load() {
  try {
    return JSON.parse(localStorage.getItem(STORE) || "[]");
  } catch {
    return [];
  }
}

function save(next) {
  rooms = next;
  localStorage.setItem(STORE, JSON.stringify(rooms));
}

function drawSaved() {
  $("settings-saved").innerHTML = rooms.length === 0 ? "" : rooms.map((r, i) => `
    <div>
      <span>${escapeHtml(r.label || r.workspace)}</span>
      <span class="where">${escapeHtml(r.workspace)} · ${escapeHtml(r.url)}</span>
      <span class="spacer" style="flex:1"></span>
      <button class="link" data-forget="${i}" type="button">forget</button>
    </div>`).join("");
  for (const button of $("settings-saved").querySelectorAll("[data-forget]")) {
    button.onclick = () => {
      const next = rooms.slice();
      next.splice(Number(button.dataset.forget), 1);
      save(next);
      drawSaved();
      refresh();
    };
  }
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

async function readLocal() {
  const query = selected ? "?room=" + encodeURIComponent(selected) : "";
  const response = await fetch("api/state" + query, { cache: "no-store" });
  return response.json();
}

async function readHere() {
  if (rooms.length === 0) return null;
  const current = rooms.find((r) => id(r) === selected) || rooms[0];
  const state = await snapshot(current, { refresh: 3 });
  state.rooms = await Promise.all(rooms.map(async (r) =>
    id(r) === id(current)
      ? {
          id: id(r), label: r.label || r.workspace, source: "settings",
          hub: r.url, workspace: r.workspace, encrypted: Boolean(r.key),
          selected: true, error: null,
          awake: state.agents.filter((a) => !a.stale).length,
        }
      : { ...(await summarise(r)), selected: false }));
  return state;
}

const id = (r) => `${r.url}/${r.workspace}`;

/** Closing a tab is forgetting the room — the same act as "forget" in the
 *  settings sheet, so it goes through the same store. */
function forget(which) {
  save(rooms.filter((r) => id(r) !== which));
  if (selected === which) selected = null;   // fall back to whatever is first
  drawSaved();
  refresh();
}

async function refresh() {
  clearTimeout(timer);
  try {
    const state = LOCAL ? await readLocal() : await readHere();
    if (state) {
      misses = 0;
      latest = state;
      render(state, {
        onRoom: (which) => { selected = which; refresh(); },
        // Config-served rooms come back on the next poll however firmly you
        // close them, so only the browser's own list offers the ×.
        onClose: LOCAL ? undefined : forget,
      });
    } else {
      $("status").textContent = "no rooms yet";
      $("live").className = "dot off";
      prefill();
      // Not if it is already up. An invite in the URL opens it first, filled,
      // and `showModal` on an open dialog throws — which would surface as
      // "page error" over the sheet the reader is being asked to confirm.
      if (!$("settings").open) $("settings").showModal();
    }
  } catch (e) {
    misses += 1;
    if (misses === 1 && latest) {
      // Keep showing the last good room rather than blanking it: it is a few
      // seconds stale, which the header says, and that beats a page that
      // throws away everything it knows over one dropped request.
      render({ ...latest, hub: { ...latest.hub, reachable: false }, stale: true });
    } else {
      $("live").className = "dot off";
      $("status").textContent = LOCAL ? "viewer unreachable" : "page error: " + e.message;
    }
  } finally {
    const wait = latest ? latest.refresh_ms : 3000;
    timer = setTimeout(refresh, document.hidden ? Math.max(wait, 15000) : wait);
  }
}

// A backgrounded tab polls slowly and catches up the moment it is looked at.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) refresh();
});

/** Start on the managed hub, because that is the one a reader arriving here
 *  has not had to set up. Only ever a starting value: a typed hub wins, and
 *  the field is left alone once it holds anything. */
function prefill() {
  if (!$("f-url").value) $("f-url").value = MANAGED_HUB;
}

/** An invite is the four fields below, already agreed with whoever sent it.
 *
 *  It fills them rather than replacing them, so what is about to be saved
 *  stays visible and correctable — a form that silently swallows a string and
 *  says "done" gives a reader no way to notice it pasted the wrong one. The
 *  probe rides along in the saved room, and is what later turns "these
 *  settings" into "the same room", so it is deliberately not shown as a field.
 */
let invitedProbe = "";

function applyInvite(text) {
  const warn = $("invite-warn"), ok = $("invite-ok");
  warn.hidden = ok.hidden = true;
  invitedProbe = "";
  if (!String(text).trim()) return;
  let invite;
  try {
    invite = decodeInvite(text);
  } catch (e) {
    warn.hidden = false;
    warn.textContent = e instanceof InviteError ? e.message : String(e);
    return;
  }
  $("f-url").value = invite.url;
  $("f-workspace").value = invite.workspace;
  if (invite.key) $("f-key").value = invite.key;
  if (invite.token) $("f-token").value = invite.token;
  if (invite.note && !$("f-label").value) $("f-label").value = invite.note;
  invitedProbe = invite.probe;
  ok.hidden = false;
  ok.textContent = "read this invite: " + invite.workspace + " on " + invite.url
    + (invite.key ? ", with a key"
                  : invite.keyId ? `, no key — it names key '${invite.keyId}', ` +
                                   "so paste that one below"
                                 : ", no key")
    + (invite.probe ? ". It carries a proof-of-room, checked once you are in."
                    : ". It carries no proof-of-room, so nothing can check it.")
    + (invite.note ? ` — ${invite.note}` : "");
}

/** An invite arriving in the URL, as `…/#swb1_…`.
 *
 *  A fragment rather than a query on purpose, and it is the only reason this
 *  is offerable at all: fragments are never sent to the server, so the host
 *  of this page never receives the key in its logs, and neither does anything
 *  the browser sends a Referer to.
 *
 *  It fills the sheet and stops, exactly as a paste does. A link is *less*
 *  trustworthy than a paste — it arrives from somewhere, often forwarded —
 *  and a page that read a URL and silently joined a room would give its
 *  reader nowhere to notice they had opened the wrong one.
 *
 *  Then the fragment is scrubbed from the address bar. What is left otherwise
 *  is a key sitting in browser history, in the next screenshot, and in
 *  whatever "copy link" pastes. Costs a reload, which by then re-reads the
 *  room from storage anyway.
 */
function invitedByUrl() {
  const raw = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
  const blob = raw.replace(/^invite=/, "");
  if (!blob.startsWith("swb1_")) return false;
  history.replaceState(null, "", location.pathname + location.search);
  prefill();
  $("f-invite").value = blob;
  applyInvite(blob);
  $("settings").showModal();
  return true;
}

if (!LOCAL) {
  rooms = load();
  $("settings-open").hidden = false;
  $("settings-open").onclick = () => { drawSaved(); prefill(); $("settings").showModal(); };
  // On input rather than on submit: a bad invite should say so while the
  // string is still on screen to compare against, not after the sheet closes.
  $("f-invite").addEventListener("input", (event) => applyInvite(event.target.value));
  $("settings-form").addEventListener("submit", (event) => {
    if (event.submitter && event.submitter.value !== "save") return;
    const data = new FormData($("settings-form"));
    const entry = Object.fromEntries(
      [...data.entries()].map(([k, v]) => [k, String(v).trim()]));
    delete entry.invite;   // the fields it filled are what gets stored
    if (invitedProbe) entry.probe = invitedProbe;
    if (!entry.url || !entry.workspace) return;
    entry.url = entry.url.replace(/\/$/, "");
    // The managed hub's token is the same for everyone and nobody types it.
    // A hub someone else runs gets no token they did not enter.
    if (!entry.token && entry.url === MANAGED_HUB) entry.token = MANAGED_TOKEN;
    save([...rooms.filter((r) => id(r) !== id(entry)), entry]);
    selected = id(entry);
    $("settings-form").reset();
    invitedProbe = "";
    $("invite-ok").hidden = $("invite-warn").hidden = true;
    setScope({});
    refresh();
  });
  invitedByUrl();
  if (location.protocol !== "https:" && location.hostname !== "localhost"
      && location.hostname !== "127.0.0.1") {
    // A key typed into a page delivered over plain HTTP is a key handed to
    // anyone on the path, and WebCrypto is not even available here.
    $("settings-warn").hidden = false;
    $("settings-warn").textContent =
      "This page is not on https, so nothing typed here is protected in transit " +
      "and the browser will not provide the crypto it needs.";
  }
}

// --- the scope lives in the URL ----------------------------------------------
//
// A filter that only lives in a module variable is forgotten on every reload,
// and cannot be sent to anybody: "look at what the parser said about escapes"
// stays a sentence rather than becoming a link.
//
// In the fragment, under a prefix of our own. The fragment is where an invite
// arrives, so the invite is read first and scrubbed first; and a fragment this
// page did not write — an anchor somebody else put there — is left exactly
// where it was found, which means we only ever overwrite our own.
const VIEW = "#view=";

function scopeToUrl(current) {
  const parts = [];
  if (current.c) parts.push("c=" + encodeURIComponent(current.c));
  if (current.from) parts.push("from=" + encodeURIComponent(current.from));
  if (current.q) parts.push("q=" + encodeURIComponent(current.q));
  const ours = location.hash === "" || location.hash.startsWith(VIEW);
  if (!ours) return;
  const hash = parts.length ? VIEW + parts.join("&") : "";
  // replaceState, not push: a back button that walks a reader through every
  // chip they tried is not history, it is a log.
  history.replaceState(null, "", location.pathname + location.search + hash);
}

function scopeFromUrl() {
  if (!location.hash.startsWith(VIEW)) return;
  const fields = new URLSearchParams(location.hash.slice(VIEW.length));
  setScope({ c: fields.get("c"), q: fields.get("q"), from: fields.get("from") });
  $("q").value = fields.get("q") || "";
}

onScopeChange(scopeToUrl);
// After `invitedByUrl` in browser mode, which scrubs an invite fragment before
// anything else is allowed to read one.
scopeFromUrl();

// --- searching ---------------------------------------------------------------
//
// On input rather than on submit, and debounced only as far as one frame: the
// list is already in memory, so there is nothing to wait for, and a search that
// answers as you type is the difference between narrowing a room and querying
// one.
$("q").addEventListener("input", () => {
  setScope({ ...scope(), q: $("q").value });
  scopeToUrl(scope());
  if (latest) render(latest);
});

// --- the side panels remember what you folded away ---------------------------
for (const panel of document.querySelectorAll(".panel")) {
  panel.addEventListener("toggle", () => {
    try {
      const shut = JSON.parse(localStorage.getItem(PANELS) || "[]")
        .filter((id) => id !== panel.id);
      localStorage.setItem(PANELS,
        JSON.stringify(panel.open ? shut : [...shut, panel.id]));
    } catch { /* a browser that refuses storage still gets a working page */ }
  });
}
try {
  for (const id of JSON.parse(localStorage.getItem(PANELS) || "[]")) {
    if ($(id)) $(id).open = false;
  }
} catch { /* as above */ }

// --- one pane at a time, on a narrow window ----------------------------------
//
// The switcher is CSS-hidden above 900px, so this costs a wide window nothing.
// What it cannot do in CSS is open a `<details>` the reader folded away on a
// wide one: below the breakpoint the summary is gone, so a folded panel would
// be a segment that shows nothing. Picking a segment opens it — which is the
// reader asking for it, so it is theirs to keep either way.
const NARROW = matchMedia("(max-width: 900px)");

function showPane(which) {
  document.querySelector("main").dataset.pane = which;
  for (const button of document.querySelectorAll(".pane")) {
    button.classList.toggle("on", button.dataset.pane === which);
  }
  const panel = $("p-" + which);
  if (panel) panel.open = true;
}

for (const button of document.querySelectorAll(".pane")) {
  button.onclick = () => showPane(button.dataset.pane);
}

// Coming back to a wide window, everything is on screen at once again, so the
// pane a reader chose down there is not a state to still be in.
NARROW.addEventListener("change", (e) => { if (!e.matches) showPane("convo"); });

// --- the keyboard ------------------------------------------------------------
//
// This is a page people leave open all day beside the work it is describing,
// which is exactly the kind of page that should not need the mouse.
document.addEventListener("keydown", (e) => {
  const typing = e.target.matches("input, textarea, select");
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.querySelector("dialog[open]")) return;

  if (e.key === "/" && !typing) { e.preventDefault(); $("q").focus(); return; }
  if (e.key === "Escape") {
    // One step at a time, narrowest first: a reader with a caret in the search
    // box means the search, and only a second press leaves the channel behind.
    const now = scope();
    if (now.q) { $("q").value = ""; setScope({ ...now, q: "" }); }
    else { $("q").blur(); setScope({}); }
    scopeToUrl(scope());
    if (latest) render(latest);
    return;
  }
  if (typing) return;
  if (e.key === "End" || e.key === "g") {
    e.preventDefault();
    const jump = $("jump"), pane = $("messages");
    // The pill does the catching-up as well as the scrolling, so use it when
    // there is one; otherwise there is nothing to catch up on.
    if (jump && !jump.hidden) jump.click();
    else pane.scrollTo({ top: pane.scrollHeight, behavior: "auto" });
    return;
  }
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    const tabs = [...document.querySelectorAll(".room")];
    if (tabs.length < 2) return;
    const at = tabs.findIndex((t) => t.classList.contains("on"));
    const next = tabs[(at + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
    if (next) { e.preventDefault(); next.click(); }
  }
});

refresh();
</script>
</body>
</html>
