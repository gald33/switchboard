# A hub your agents can reach. Put a TLS-terminating proxy in front of it
# before exposing it beyond localhost — see docs/deployment.md.
#
# Auth is one optional bearer token, set in `.env` (gitignored) or the
# environment. It is a front door, not authorization: every admitted caller
# can reach every room whose identifier it knows. What protects a room is that
# its identifier is unguessable and its contents are sealed with a key this
# hub never receives.
#
# Leave it unset only for something bound to localhost.
services:
  switchboard:
    build: .
    image: agent-switchboard:latest
    container_name: switchboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # Shared bearer token. Generate with:
      #   python -c 'import secrets;print(secrets.token_urlsafe(32))'
      SWITCHBOARD_TOKEN: ${SWITCHBOARD_TOKEN:-}
      SWITCHBOARD_DB: /data/switchboard.db
      # Origins allowed to read this hub from a browser, comma-separated.
      # Empty means no browser may, which stays the default for a hub with no
      # page pointed at it: CORS headers are attack surface you should not
      # carry for a client you do not have.
      #
      # The default below is where this repo publishes the viewer's browser
      # build (.github/workflows/pages.yml). Override it in `.env` if you host
      # the page somewhere else; set it empty to turn browser reads off.
      #
      # Allowing an origin is not a grant of access. Every request still
      # carries the same bearer token and every body is still sealed with a
      # key this hub never receives, so the worst a hostile page gains is the
      # ability to make a request it cannot authenticate. That is also why
      # `allow_credentials` is false in server.py — the auth is a header, not
      # a cookie, so nothing rides along on origin alone.
      SWITCHBOARD_CORS_ORIGINS: ${SWITCHBOARD_CORS_ORIGINS-https://gald33.github.io}
    volumes:
      - switchboard-data:/data

  # The hosted bridge: what ChatGPT connects to when its user runs nothing of
  # their own (docs/chatgpt.md). Off unless asked for —
  #
  #   docker compose --profile bridge up -d bridge
  #
  # — because running it is a decision, not a default: whoever runs it can
  # read every room whose invite is sent to it, and every such room's roster
  # names SWITCHBOARD_BRIDGE_OPERATOR as that person.
  #
  # Pulled, never built here. The point of the image is the signed statement
  # GitHub makes about it (.github/workflows/bridge.yml); an image built on
  # this host would carry none, and the digest it published would prove
  # nothing. Pin BRIDGE_IMAGE to a digest in `.env`, and set the same value as
  # SWITCHBOARD_BUILD_IMAGE so the bridge publishes what it was started from.
  bridge:
    profiles: ["bridge"]
    image: ${BRIDGE_IMAGE:-ghcr.io/gald33/switchboard-bridge:latest}
    container_name: switchboard-bridge
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      # Required, and enforced by the bridge rather than by `:?` here: compose
      # interpolates every service whether its profile is on or not, so a
      # `:?` would fail the hub's own deploy on any host that never runs this.
      SWITCHBOARD_BRIDGE_OPERATOR: ${SWITCHBOARD_BRIDGE_OPERATOR:-}
      SWITCHBOARD_BRIDGE_URL: ${SWITCHBOARD_BRIDGE_URL:-}
      # Hubs whose rooms it serves, comma-separated. Empty means the managed
      # hub only. An invite naming any other hub is refused, or it would be a
      # way to make this host fetch arbitrary addresses on request.
      SWITCHBOARD_BRIDGE_HUBS: ${SWITCHBOARD_BRIDGE_HUBS:-}
      SWITCHBOARD_BUILD_IMAGE: ${BRIDGE_IMAGE:-}
    # Nothing to keep, so nothing to mount: the bridge holds every agent in
    # memory and a restart forgets them.
    read_only: true
    tmpfs:
      - /tmp

volumes:
  switchboard-data:
