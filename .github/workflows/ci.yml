name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q

  # The client, CLI and MCP bridge must install and work with httpx alone.
  # This job fails if a server-only import leaks into them.
  minimal-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: import client, CLI and MCP bridge without the server extra
        run: |
          python -c "import switchboard, switchboard.cli, switchboard.mcp_server, switchboard.crypto"
          python - <<'PY'
          import importlib.util as u
          # The server extra stays optional: nothing an agent runs needs a web
          # framework. cryptography is deliberately *not* in this list any more
          # — `init` encrypts by default, so a base install that cannot encrypt
          # is not a working install. Leaving it optional is what shipped a
          # package that raised CryptoError at startup for anyone following the
          # documented flow.
          leaked = [p for p in ("fastapi", "uvicorn", "starlette") if u.find_spec(p)]
          assert not leaked, f"server extra leaked into the base install: {leaked}"
          import switchboard.crypto as c
          assert c.AVAILABLE is True, "a base install must be able to encrypt"
          # and the fallback path must still be honest if cryptography is ever
          # unavailable for a platform reason, rather than ImportError-ing at
          # the top of an unrelated module
          assert c.WorkspaceCipher.from_key(c.generate_key(), "w") is not None
          PY
      - run: switchboard --version
      - name: the MCP bridge must answer initialize with no hub running
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | switchboard-mcp | grep -q '"serverInfo"'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-switchboard:ci .
      - name: hub answers /health
        run: |
          docker run -d --name swb -p 8787:8787 -e SWITCHBOARD_TOKEN=ci agent-switchboard:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/health && break || sleep 1
          done
          curl -sf http://127.0.0.1:8787/health | grep -q '"ok":true'
          docker rm -f swb

  # Dogfooding: this CI run announces itself on the same hub the rest of
  # this project coordinates over, same as local/cloud agents do via the
  # SessionStart hook `init` installs (see cli.py's _SESSION_START_CMD).
  # It announces into its own workspace rather than the interactive one, so a
  # CI run never shows up in the middle of a human session's peers.
  #
  # The token is read from MANAGED_HUB_TOKEN in the checkout, the same way
  # deploy.yml reads the value it starts the hub with. That is the whole point:
  # a private second copy in `secrets.SWITCHBOARD_TOKEN` drifted from the hub's
  # own token and locked this job out for a day without failing a build (#96).
  # Since #76 a token admits a caller to the hub and scopes nothing, so there
  # is nothing for a secret copy to protect that the published one does not.
  #
  # Never gates the rest of CI, and never fails silently either: the announce
  # cannot break a build, but a failure is reported as a warning on the run
  # instead of one line of stderr in a green job.
  register-switchboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Announce this CI run to the hub
        env:
          SWITCHBOARD_URL: https://switchboard.lucille-ai.com
          SWITCHBOARD_WORKSPACE: w_gAbpTxVh-Jl0pjx0Hnqupw
        run: |
          SWITCHBOARD_TOKEN="$(sed -n 's/^MANAGED_HUB_TOKEN = "\([^"]*\)".*/\1/p' \
            src/switchboard/cli.py | head -1)"
          export SWITCHBOARD_TOKEN
          if [ -z "$SWITCHBOARD_TOKEN" ]; then
            echo "::warning title=switchboard::MANAGED_HUB_TOKEN not found in" \
              "src/switchboard/cli.py — this CI run was not announced"
            exit 0
          fi
          if ! out="$(switchboard -q register --kind ci -c build \
              --task "${{ github.event_name }} ${{ github.ref_name }}@${{ github.sha }}" 2>&1)"; then
            # Last line only: an auth failure is one line, but a connection
            # failure is a whole httpx traceback (#88), and a warning is a
            # one-line surface. The last line is the diagnosis in both cases.
            echo "::warning title=switchboard::announce failed:" \
              "$(printf '%s' "${out:-no output}" | tail -n 1)"
          fi
