name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q

  # The client, CLI and MCP bridge must install and work with httpx alone.
  # This job fails if a server-only import leaks into them.
  minimal-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: import client, CLI and MCP bridge without the server extra
        run: |
          python -c "import switchboard, switchboard.cli, switchboard.mcp_server, switchboard.crypto"
          python - <<'PY'
          import importlib.util as u
          # The server extra stays optional: nothing an agent runs needs a web
          # framework. cryptography is deliberately *not* in this list any more
          # — `init` encrypts by default, so a base install that cannot encrypt
          # is not a working install. Leaving it optional is what shipped a
          # package that raised CryptoError at startup for anyone following the
          # documented flow.
          leaked = [p for p in ("fastapi", "uvicorn", "starlette") if u.find_spec(p)]
          assert not leaked, f"server extra leaked into the base install: {leaked}"
          import switchboard.crypto as c
          assert c.AVAILABLE is True, "a base install must be able to encrypt"
          # and the fallback path must still be honest if cryptography is ever
          # unavailable for a platform reason, rather than ImportError-ing at
          # the top of an unrelated module
          assert c.WorkspaceCipher.from_key(c.generate_key(), "w") is not None
          PY
      - run: switchboard --version
      - name: the test harness imports without the server extra
        # `switchboard.testing` needs fastapi to *run* a hub, and says so. But
        # importing it must not need one, or a conftest that imports it breaks
        # collection for every client-only install — including the ones whose
        # tests never call `hub()`. Its framework imports are deliberately
        # inside the functions that use them; this is what keeps them there.
        run: |
          python - <<'PY'
          import importlib.util as u
          import switchboard.testing as t
          assert t.Clock().advance(60) == t.EPOCH + 60
          assert not u.find_spec("fastapi"), "importing the harness pulled in the server extra"
          PY
      - name: the MCP bridge must answer initialize with no hub running
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | switchboard-mcp | grep -q '"serverInfo"'

  # The viewer, installed the way somebody else installs it.
  #
  # This job is the reason the viewer is a separate distribution at all. It is
  # the only thing here that consumes the SDK from outside, so what it needs
  # has to be *exported* rather than reachable — and from inside a source tree
  # that distinction is invisible, because `src/` is on the path either way.
  # Two wheels and a directory that is not the repo make it visible.
  #
  # The SDK comes from PyPI, not from this checkout, which is the whole point:
  # it proves the add-on needs nothing that is merely *reachable* in a source
  # tree, and nothing that has not actually been released. When `main` grows
  # API the viewer starts using, this job goes red until that API ships — which
  # is the honest moment to find out, rather than after someone runs
  # `pip install switchboard-viewer` and gets an ImportError.
  #
  # (It went red exactly that way on its first run: 0.7.2 had no `rooms_in`.)
  viewer-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the add-on's wheel — and only the add-on's
        run: |
          pip install build
          python -m build --wheel --outdir /tmp/wheels extras/viewer
      - name: install it, resolving the SDK from PyPI like anyone else
        run: pip install /tmp/wheels/*.whl
      - name: it must not have pulled this repo's source in
        run: |
          python - <<'PY'
          import pathlib, switchboard, switchboard_viewer
          here = pathlib.Path.cwd().resolve()
          for module in (switchboard, switchboard_viewer):
              where = pathlib.Path(module.__file__).resolve()
              assert here / "src" not in where.parents, f"{module.__name__} came from {where}"
          print("switchboard", switchboard.__version__, "from", switchboard.__file__)
          PY
      - name: it runs, and the page it serves came with it
        run: |
          switchboard-viewer --help > /dev/null
          python - <<'PY'
          import pathlib, switchboard_viewer
          web = pathlib.Path(switchboard_viewer.__file__).with_name("web")
          missing = [name for name in ("index.html", "render.js",
                                       "switchboard-room.js", "switchboard-open.js")
                     if not (web / name).exists()]
          assert not missing, f"the wheel left the browser build behind: {missing}"
          PY
      - name: python -m works too, for a PATH without console scripts
        run: python -m switchboard_viewer --help > /dev/null

  # The page, in a real browser. Separate from `test` on purpose: nothing here
  # varies by Python version, so putting Chromium in that 4-way matrix would
  # download it four times to learn one thing.
  #
  # This job exists because the tests it runs were passing without running.
  # `test_web_page.py` guards `extras/viewer/switchboard_viewer/web` behind `importorskip("playwright")`,
  # which is not installed by the `test` job — so every browser assertion
  # skipped in CI while reporting green, including the ones that check the
  # published page dials the right hub with the right token. The board-key
  # change in #119 edited `switchboard-room.js` and was verified only because
  # playwright happened to be installed by hand on one machine.
  #
  # The cheap half of that coverage now runs in the `test` job without a
  # browser — `test_web_snapshot.py` drives the same `snapshot()` under node.
  # What is left here is what genuinely needs one: rendering, the settings
  # sheet, localStorage, and the cross-origin request a browser refuses to
  # send. `continue-on-error` is deliberately NOT set: a skip that reports
  # success is the failure being fixed.
  browser:
    runs-on: ubuntu-latest
    # This job used to install system packages, and it was the only one that
    # ever hung or failed on something outside the repo. On #138
    # `playwright install --with-deps` sat in apt for 71 minutes; on #251 the
    # same step failed twice with a Hash Sum mismatch fetching Google's Chrome
    # index, because `--with-deps` adds apt — and therefore dl.google.com — to
    # the critical path of a job that only needs a browser binary.
    #
    # ubuntu-latest already ships the shared libraries Chromium links against,
    # so the deps step is gone. If that ever stops being true, Chromium fails
    # to launch and the tests below go red — loudly, and without a skip, which
    # the last step enforces.
    #
    # The timeout stays: it bounded the hang before and costs nothing.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]' playwright
      - run: playwright install chromium
      - name: the page, in a browser — and nothing may skip
        # `-p no:randomly` keeps the summary line stable to grep. The skip
        # check is the whole point of the job: if the browser fixture ever
        # opts out again, this must go red rather than green-with-nothing-run.
        run: |
          set -o pipefail
          pytest -q -rs tests/test_web_page.py tests/test_web_reader.py | tee out.txt
          if grep -qE '[0-9]+ skipped' out.txt; then
            echo "::error title=browser tests::something skipped — reasons above"
            exit 1
          fi

  # The landing page quotes real terminal output. Until #277 the largest of
  # those blocks was generated from site/demo.cast, so it could not drift;
  # that generator is gone and the quotes are now placed by hand, which means
  # a change to the CLI's output can leave the page showing a line no run
  # prints any more. site/PRINCIPLES.md principle 4 is the whole reason this
  # page is worth anything, so it is checked rather than trusted.
  #
  # Offline on purpose: it reads only files in this repository. The island
  # boards are quoted from another host and are checked by hand with
  # `python3 site/check-quotes.py --online`, because a CI run should not go
  # red over somebody else's uptime. Stdlib only, so there is nothing to
  # install.
  site-quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 site/check-quotes.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-switchboard:ci .
      - name: hub answers /health
        run: |
          docker run -d --name swb -p 8787:8787 -e SWITCHBOARD_TOKEN=ci agent-switchboard:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/health && break || sleep 1
          done
          curl -sf http://127.0.0.1:8787/health | grep -q '"ok":true'
          docker rm -f swb

  # A smoke test against the real hub, not a notice board.
  #
  # This used to announce into a fixed room so a CI run appeared beside the
  # human sessions. That room's identifier sat in this file in plain text, and
  # since #73 the hub does no authorization — reaching a room IS knowing its
  # identifier — so it was the one published room in a repository whose own
  # .gitignore refuses to commit .mcp.json for the same reason.
  #
  # The fix is not a secret. Nobody was reading what CI announced, so the room
  # does not need to persist: the job mints its own, uses it, and drops it. No
  # identifier to leak, no key to rotate, no secret withheld from a fork's pull
  # request — and the job now behaves identically for a contributor as it does
  # on main.
  #
  # What it buys beyond safety: the old job could not fail. It warned and
  # exited green, so a client that could not reach the hub at all still showed
  # a passing check. This one mints, announces, and reads the roster back,
  # asserting the agent it just created is there. That is the whole client
  # path — keygen, seal, POST, GET, decrypt — against the live hub on every
  # run, and it goes red when any of it breaks.
  #
  # The token still comes from MANAGED_HUB_TOKEN in the checkout rather than a
  # secret: a private copy drifted from the hub's own token and locked this job
  # out for a day without failing a build (#96). Since #76 a token admits a
  # caller and scopes nothing, so a secret copy protects nothing the published
  # one does not.
  register-switchboard:
    # Never on a pull request. This is the one job that talks to a server
    # somebody has to keep up, and a hub reboot must not turn a contributor's
    # PR red for a reason that has nothing to do with their change — red for
    # no reason is how people learn to ignore red.
    #
    # On main it gates, which is the point: a check that cannot fail is not a
    # check, and the old one warned and exited green even when the client
    # could not reach the hub at all.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Mint a room, announce into it, and read it back
        env:
          SWITCHBOARD_URL: https://switchboard.lucille-ai.com
          SWITCHBOARD_AGENT_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          SWITCHBOARD_TOKEN="$(sed -n 's/^MANAGED_HUB_TOKEN = "\([^"]*\)".*/\1/p' \
            src/switchboard/config.py | head -1)"
          if [ -z "$SWITCHBOARD_TOKEN" ]; then
            echo "::error title=switchboard::MANAGED_HUB_TOKEN not found in" \
              "src/switchboard/config.py"
            exit 1
          fi
          export SWITCHBOARD_TOKEN

          # A room of its own, thrown away when the job ends. Everything in it
          # expires on its own anyway — presence in two minutes.
          eval "$(switchboard keygen --no-input | sed 's/^/export /')"

          MARK="${{ github.event_name }} ${{ github.ref_name }}@${{ github.sha }}"
          switchboard -q announce --kind ci -c build --task "$MARK"

          # The assertion, and it is deliberately on the task rather than on
          # the agent id. Ids are scrambled before they reach the hub, so the
          # one in SWITCHBOARD_AGENT_ID never appears in a roster — an
          # assertion against it fails every time, which is how this was
          # written the first time and caught by rehearsing it.
          #
          # The task is sealed on the way out and opened on the way back, so
          # finding it here proves the whole path: mint, seal, POST, GET,
          # decrypt. Announcing alone would only prove a write was accepted.
          if ! switchboard --json agents | grep -qF "$MARK"; then
            echo "::error title=switchboard::announced \"$MARK\" but it did" \
              "not come back from the roster"
            switchboard --json agents
            exit 1
          fi
          echo "hub round trip ok — announced and read back: $MARK"
