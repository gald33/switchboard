id: web-page-tests-fail-under-load
title: Two web-page tests fail on a loaded full run and pass on every rerun
status: ready
priority: next
blocked_on: []
related_to:
- key: intermittent-suite-failure
  note: 'Read that one first, then do NOT assume this is it. That was tests/test_whisper.py,
    root-caused to signing.socket_path() deriving one socket per agent id so two pytest
    processes adopted each other''s signing identity, and it reproduced only with two
    suites in parallel. This is a different file on a single suite, so the fixture that
    closed it does not apply. The shared lead is wall-clock sensitivity, not the cause.'
refs:
- 'Inferred from this project''s own runs on 2026-09-13, not a filed issue — see the first line of evidence.'
evidence: |
  **Observed directly rather than reported.** During verification of #282, one
  full local run reported `2 failed, 1559 passed` in **671s**:

  * `tests/test_web_page.py::test_a_tab_can_be_closed_and_the_room_is_forgotten`
  * `tests/test_web_page.py::test_a_panel_folded_away_stays_folded`

  Two reruns were clean: `tests/test_web_page.py` alone gave 49 passed in 55.7s,
  and the whole suite gave `1561 passed` in **259.4s**. Twelve CI checks on the
  same commit were green across 3.10–3.13.

  **The failing run took 2.6x the wall time of the clean one.** That is the
  whole finding, and it is the same shape the previous suite flake left behind:
  something wall-clock sensitive — a TTL, a heartbeat deadline, a `wait=` bound,
  an expiry compared against `time.time()` rather than an injected clock — where
  a margin that normally holds gets missed under load. The machine was running
  CI waiters and a second suite at the time.

  What distinguishes it from `intermittent-suite-failure`, which is `done`:
  that one was `tests/test_whisper.py`, root-caused to `signing.socket_path()`
  deriving the signing socket from the agent id alone, and it reproduced only
  by running **two suites in parallel**. This was a single suite, a different
  file, and the per-process `XDG_RUNTIME_DIR` fixture that closed it was already
  in place. Filing it separately rather than reopening that one, so a solved
  problem is not buried under an unsolved one.

  Both named tests concern *remembered UI state* — a closed tab whose room is
  forgotten, a folded panel that stays folded — which is where a timing-
  sensitive assertion about persistence would surface first. A hypothesis, not
  a finding.

  Why it earns a slot rather than a shrug: the argument the previous item made
  and proved. An intermittent failure nobody can name is indistinguishable from
  a real regression the next time it fires, so it costs a full investigation on
  every sighting, and it trains whoever sees it to rerun and move on — the exact
  habit that lets a flake-shaped bug through. That item took a load experiment to
  crack after six clean sequential runs said nothing; the same will be true here,
  so reproduce under load rather than by repetition.

  How it will be known to have worked: the mechanism is **named** — captured
  with `-rf` per-test output under deliberate load, not from a summary line —
  and then either fixed or shown to be a genuine bug in what those two tests
  assert.

  ---

  **Half of it is named, reproduced deterministically, and fixed. The other
  half is not, and the negative is recorded below rather than rounded up.**

  Method first, because the trap this item was filed to avoid is real: the
  previous flake survived six clean sequential runs and cracked only under
  parallel load. So nothing here was concluded from a rerun. Four full suites
  at once on a four-core box, two full suites at once, then the file alone
  under 8 and 32 CPU burners — all with `-rf`. **Every one of those was clean**,
  and the reason turns out to be arithmetic rather than luck.

  **The mechanism: presence expires, and nothing renewed it.**

  `tests/test_web_page.py` builds its rooms in **module-scoped** fixtures.
  `room` registers `parser-agent` once, and the 49 tests in the file then read
  that one roster. `DEFAULT_AGENT_TTL` is **120 seconds**
  (`src/switchboard/config.py:59`), a `register` with no explicit ttl gets
  exactly that, and nothing in the file ever heartbeats. So the registration
  lapses partway through a run that is slow enough, and every test after that
  point is reading a roster its own fixture has already aged off.

  Instrumenting how old that registration is when each test runs, on a
  four-way-parallel run:

      3.8s  test_the_page_decrypts_in_the_browser_and_shows_it
      6.0s  test_a_tab_can_be_closed_and_the_room_is_forgotten
     50.9s  test_a_panel_folded_away_stays_folded
     62.7s  (end of file)

  `test_a_panel_folded_away_stays_folded` asserts `#n-agents == "1"` and sits
  **50.9s** in, against a **120s** ttl. **The file therefore has to run 2.36x
  slow before that test crosses the mark — and the failing run was 2.6x**
  (671s against a 259s norm). 2.6 x 50.9s = 132s, which is past it. The only
  other roster-dependent test in the file sits at 3.8s and would have needed a
  31x slowdown, which is precisely why it passed in the same run that this one
  failed. The 2.6x figure was the lead recorded above; it turns out to have
  been the whole answer, and to predict which two tests fail rather than merely
  suggesting that something might.

  Shown deterministically rather than statistically, because a cliff at a fixed
  wall-clock mark can never be found by repetition — only by being slow enough,
  which is the thing a rerun on an idle machine is guaranteed not to be.
  Stalling the module 125s between the fixture and the test, with no clock
  mocked and no product code touched, reproduces it exactly:

      >           assert tab.inner_text("#n-agents") == "1"
      E           AssertionError: assert '' == '1'

  `''` rather than `'0'` because `render.js` draws an empty count for zero on
  purpose (`el.textContent = n || ""`). **Nothing about the page is wrong
  here.** The agent really did lapse, and an empty roster really is what the
  page should draw for it. What is wrong is a fixture that registers a presence
  once and then assumes presence is permanent, in a system whose first rule is
  that every record expires.

  Aging the whole module past the ttl before test 3 shows exactly which tests
  depend on that roster — two of the 49, and the other is the one at 3.8s:

      FAILED tests/test_web_page.py::test_the_page_decrypts_in_the_browser_and_shows_it
      FAILED tests/test_web_page.py::test_a_panel_folded_away_stays_folded
      2 failed, 47 passed in 186.77s

  **`intermittent-suite-failure` is ruled out rather than assumed away.** That
  was `signing.socket_path()` deriving one signing socket per agent id, and it
  needed two pytest processes to collide. Its per-process `XDG_RUNTIME_DIR`
  fixture is in `conftest.py` and was in place for every run here. This
  reproduces in **one** process with nothing else on the machine, so it cannot
  be that.

  **Fixed in the fixtures, not in the product**, on the same reasoning that
  item recorded. A real agent stays on a roster by heartbeating, so these do
  now: an autouse fixture renews every module-scoped room's presence before
  each test, and a heartbeat that comes back "unknown or expired agent" —
  reachable only if one test outran the whole ttl — re-registers instead of
  failing every test after it. Because `heartbeat` renews the agent's leases
  too, the claims panel comes along for free; it was on a 900s version of the
  same cliff. Verified against the condition that produced the failure: with
  the module aged 125s past the ttl, the file was `2 failed, 47 passed` before
  and `50 passed` after.

  There is a test for the mechanism rather than for the symptom —
  `test_a_fixture_room_is_still_on_its_roster_after_its_ttl`, which shows the
  cliff with a two-second ttl and then shows the renewal clearing it, in three
  seconds instead of two minutes.

  **`test_a_tab_can_be_closed_and_the_room_is_forgotten` is NOT this, and stays
  open.** It runs **6.0s** into the file, so the 120s roster cliff cannot reach
  it — the file would have to run 20x slow — and aging the fixtures past the
  ttl leaves it passing. Two tests failed together in one run for two different
  reasons, which is the part that made this look like one flake.

  What it is instead is not named yet. Every margin in it is a 10s Playwright
  wait against a page that repolls every 3s, and the one thing it does that no
  other test does is add a second room in an empty workspace and then close it,
  which crosses an in-flight `refresh()` — `readHere()` in `index.html` reads
  the module-level `rooms` array on both sides of an `await`, so a poll that
  started before the × can render the strip it was closing. That is a
  hypothesis with a plausible shape and no capture behind it, which is exactly
  the standard this item exists to refuse.

  **The negative, recorded so it bounds the rate rather than reassuring
  anybody.** Under deliberate load the two-suite and four-suite rounds and the
  8- and 32-burner file runs were all clean, and 40 further runs of that test
  alone under 16 CPU burners were clean. But the load achieved was **1.1x to
  1.7x**, against the **2.6x** of the run that failed: this box is I/O- and
  sleep-bound, so starving it of CPU has sharply diminishing returns (8 burners
  bought 1.41x, 32 bought 1.68x). So the honest statement is that the
  conditions which produced the original failure were **not reached**, not that
  the failure did not occur under them. The roster half was closed by
  measurement and a stall instead, and the same instrument is what the next
  attempt on this half should carry: name the assertion that fails from a
  captured `-rf` run, do not infer it from the summary.

  ---

  **Second pass. One claim above is wrong and is corrected here; the mechanism
  it was arguing for is now measured directly instead of inferred.**

  **Correction.** The line above — "the file has to run 2.36x slow before that
  test crosses, and the failing run was 2.6x" — treated a *whole-suite*
  slowdown ratio as if it were the *file's* internal one. It is not, and the
  prediction it implies is false. Twelve pre-fix suites run in parallel at
  **3.15x–3.18x**, comfortably past that supposed line, and
  `test_a_panel_folded_away_stays_folded` **passed in all twelve**. The 2.36x
  figure should not be used; it was arithmetic on the wrong quantity.

  What the right quantity says, measured rather than derived. Instrumenting one
  suite inside a twelve-way parallel run and reading the age of the `room`
  registration at each test:

      suite wall time 827s = 3.19x

       19.8s  test_the_page_decrypts_in_the_browser_and_shows_it
       24.3s  test_a_tab_can_be_closed_and_the_room_is_forgotten
      115.1s  test_a_panel_folded_away_stays_folded   <-- ttl is 120s
      ...     nine later tests ran past the 120s mark

  **115.1s against a 120s ttl — a 4.9 second margin, and it held by that
  much.** Nine tests after it really were reading an expired roster, and passed
  only because they do not read the roster. That is the cliff, measured at the
  edge, on unmodified code: not a theory about what load would do, but the
  actual distance to the mark on the worst run this box can produce.

  It also shows why the suite ratio was the wrong lever: between a 1.1x run and
  a 3.19x run the panel test's age went 50.9s → 115.1s, a 2.3x stretch against
  a 2.9x suite stretch. The file's own timeline slows **less** than the suite
  around it, so "the suite ran 2.6x slow" cannot be converted into "the roster
  had expired" — on this box it would not have. What the original 671s run did
  to *this file* was never recorded, and cannot be recovered.

  So the mechanism stands on the deterministic evidence, which is unaffected:
  stalling the module past the ttl reproduces `assert '' == '1'` exactly, and
  aging the fixtures picks out precisely the two roster-dependent tests of 49.
  What is no longer claimed is the quantitative bridge from that run's summary
  line to that run's failure. The fix is still right, and now has a measured
  worst case behind it — 4.9s of headroom without it.

  **On the other half — `test_a_tab_can_be_closed_and_the_room_is_forgotten`.**
  It ran at 24.3s in that same 3.19x run, nowhere near the cliff, and it has
  passed in every one of the ~200 runs below. The hypothesis the first pass
  left on the table is now **falsified**, not merely untested.

  Timing every wait in it on an idle box:

      step                 median    budget   slowdown needed to fail
      wait .room===2        0.042s      10s        227x
      wait .room===0        0.044s      10s        165x
      wait .msg>0           0.021s      10s        367x
      reload networkidle    0.546s      30s         53x

  Nothing in it is within reach of any load this repo will ever see. And the
  reason is structural: the tab strip is drawn from the `rooms` array in
  **localStorage**, not from the hub, so closing a tab is a synchronous local
  write and the strip repaints regardless of the network.

  The suspected race is real and does **not** break the test. `refresh()` opens
  with `clearTimeout(timer)`, which cancels the *scheduled* poll but cannot
  cancel an *in-flight* one, so two refreshes can overlap. Injecting 250ms per
  fetch and stalling the test 3.2s before the × — so the click provably lands
  inside a running refresh — was instrumented directly:

      strip transitions: [2, 2, 0]   peak fetch concurrency: 2
      cycles: [[1117,1371],...,[5429,5682],[5685,6998]]
                                        ^ the × lands inside this one

  The strip goes to 0 and stays. `readHere()` rebuilds `state.rooms` from the
  module-level `rooms` *after* its await, so a late refresh reads the
  post-`forget()` value, and `save()` has already written localStorage
  synchronously. The ordering that would make it a bug is not the ordering the
  code has.

  Nor does the hub going away break it: a **total** 12s network outage imposed
  before the strip reaches two, before the ×, after the ×, and before the
  reload leaves it passing at all four points, for the same reason. Only an
  outage spanning `reload()` fails it, as `net::ERR_INTERNET_DISCONNECTED` —
  a signature a slow machine cannot produce.

  Attempts, all clean: a CPU/latency sweep (1x-6x throttle x 0-250ms), a delay
  sweep across the 3s poll boundary, 112 randomised-interleaving fuzz
  iterations under burners, 40 isolated runs under 16 burners, and the parallel
  suites above. Also corrected from the first pass: four suites on a four-core
  box is **not** contention — each gets a core, which is why it only bought
  1.11x, and that was misread as the suite being sleep-bound.

  So this half is no longer "unreproduced under the conditions we could reach".
  **The page cannot lose this test on timing**, and the next attempt should
  stop looking for a margin. What is still missing is the one thing the first
  sighting did not record: the **assertion text**. Four lines in that test can
  fail for four unrelated reasons, and the measurements above rule out only the
  timeouts. Capture the full `-rf` block, not the summary line.

  One sibling found while checking whether the roster cliff had others:
  `tests/test_web_snapshot.py:89` is the same shape — a module-scoped `room`
  registering once with no heartbeat, feeding `set(from_node[panel][0])`, which
  is an `IndexError` the moment the roster empties. Its roster-dependent test
  runs **1.4s** into a 2.4s file, so it is far from the mark and is recorded
  rather than fixed.
