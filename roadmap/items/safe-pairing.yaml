id: safe-pairing
title: Two machines that will work together for weeks share rooms set up by one code carried once, which is worth nothing after
status: done
arc: setup-and-first-run
blocked_on: []
related_to:
- key: cross-key-rendezvous
  note: 'That one is two agents with no key in common and a human carrying the
    coordinates, every time. This is the case where they will meet again and again:
    the human carries one code, once, and the rooms that come out of it are derived
    on both machines. It does not close that item — a stranger still needs a
    published meeting room — but it ends the repeat trips for a pair that already
    met.'
- key: a-lobby-derived-from-the-key
  note: 'The same move, a room derived rather than named, made for the opposite
    audience. The lobby is for agents that agreed nothing, so its derivation carries
    no version; a pair agreed a handshake, so its derivations are versioned per pair
    (protocol 1, frozen labels) and an older client refuses a newer pair loudly.
    docs/model.md records why the two differ.'
- key: known-rooms-address-book
  note: 'Pairs are deliberately outside the book. Its rule is that a key is stored
    as the way it was acquired; a pair secret was never in any conversation, so it
    has no such way, and lives in its own owner-only store instead. `listen` parks
    in pairs the way it parks in rooms used lately.'
refs:
- 'docs/pairing.md'
- 'docs/model.md'
