schema_version: 1
manifest_version: 1
org:
  id: switchboard
  repo: gald33/switchboard
  default_branch: main
  checkout: /home/user/switchboard
  operator: { name: Gal, github: gald33 }
  account: "3aa45cbd-39c1-4da0-b5c2-983ab5d7a876"
  paths:
    watchlist: docs/ai/ceo-watchlist.md
ports:
  work_store:
    tool: roadmap-core
    mode: files
    files: roadmap/
    cli: roadmap
  coordination:
    tool: switchboard
    url: https://switchboard.lucille-ai.com
    workspace: gald33/switchboard
  code_context:
    tool: repoctx
    ranker: lexical
  checks:
    tool: absent
  tickets:
    tool: github-issues
    label: ticket
  prod_read:
    method: "hub-key: the hub at https://switchboard.lucille-ai.com, read with the workspace key already in the environment ($SWITCHBOARD_KEY, with $SWITCHBOARD_URL and $SWITCHBOARD_WORKSPACE); reads only, never writes to production"
  vcs:
    tool: github
    workflows_owned: []
  sessions:
    tool: claude-code-remote
  operator_surface: docs/human/state-of-the-org.md
operator_owns: {}
roles:
  ceo:
    name: Link
  dispatcher:
    name: Marshal
    cadence: "20 */6 * * *"
    cadence_label: "every 6h"
  builder:
    name: Mason
  reviewer:
    name: Reed
  verifier:
    name: Vera
    cadence: "20 5 * * 1,4"
    cadence_label: "Mon & Thu 05:20Z"
    period_hours: 96
  checks-watch:
    name: Gus
    cadence: "45 6 * * 1,4"
    cadence_label: "Mon & Thu 06:45Z"
    period_hours: 96
  registrar:
    name: Nora
    cadence: "0 7 * * 1,4"
    cadence_label: "Mon & Thu 07:00Z"
    period_hours: 96
  account-manager:
    name: Ruth
    cadence: "15 7 * * 1,4"
    cadence_label: "Mon & Thu 07:15Z"
    period_hours: 96
  methods:
    name: Ida
  doctor:
    name: Doc
    cadence: "0 9 * * 1,4"
    cadence_label: "Mon & Thu 09:00Z"
    period_hours: 96
budget:
  daily_usd: <from the ledger>
  at_80_percent: warn
  at_100_percent: pause
knobs:
  dispatcher.cap:
    default: 3
    range:
    - 0
    - 6
fleet:
  report_to: gald33/org-core/fleet/switchboard
  sends:
  - doctor_report
  - run_ledger_delta
  - knob_overrides
  - install_log
